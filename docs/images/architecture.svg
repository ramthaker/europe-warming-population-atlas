<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">HeatReady Atlas architecture</title>
  <desc id="desc">Public climate and population data are processed into PMTiles and displayed in a MapLibre app with Amazon Location Service. A selected map cell is passed to a FastAPI service running a Strands agent, which uses read-only climate evidence and WHO guidance tools with Amazon Bedrock. S3 and CloudFront host the static site and archive; public deployment of the agent API is pending.</desc>
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2d38f"/><stop offset=".55" stop-color="#dd8059"/><stop offset="1" stop-color="#8d4053"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9aa99e"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c46c4c"/></marker>
    <style>
      .bg{fill:#f6f4ed}.ink{fill:#183a3b}.muted{fill:#71827a}.tiny{font:12px 'DM Mono',monospace;letter-spacing:1px}.title{font:500 38px Georgia,serif;letter-spacing:-1px}.subtitle{font:15px Arial,sans-serif}.card{fill:#fffefa;stroke:#d7dfd6;stroke-width:1.5}.aws{fill:#edf1e9;stroke:#cdd9ce;stroke-width:1.5}.agent{fill:#f8eee7;stroke:#e6c8b9;stroke-width:1.5}.card-title{font:600 17px Arial,sans-serif;fill:#244847}.copy{font:13px Arial,sans-serif;fill:#687a73}.small{font:11px Arial,sans-serif;fill:#7e8c83}.line{fill:none;stroke:#9aa99e;stroke-width:2;marker-end:url(#arrow)}.line-red{fill:none;stroke:#c46c4c;stroke-width:2.5;marker-end:url(#arrow-red)}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900" rx="18"/>
  <text x="72" y="72" class="tiny" fill="#bd6849">HEATREADY ATLAS · SYSTEM OVERVIEW</text>
  <text x="72" y="123" class="title ink">From climate evidence to community planning</text>
  <text x="72" y="155" class="subtitle muted">A transparent map-to-agent pattern for long-term heat preparedness context</text>

  <text x="72" y="214" class="tiny" fill="#819087">01 / PUBLIC DATA + PROCESSING</text>
  <rect x="72" y="235" width="245" height="116" rx="12" class="card"/>
  <rect x="72" y="370" width="245" height="116" rx="12" class="card"/>
  <text x="95" y="274" class="card-title">EURO-CORDEX</text>
  <text x="95" y="299" class="copy">Monthly 2 m temperature</text>
  <text x="95" y="321" class="small">CMIP5 historical + RCP runs · S3</text>
  <text x="95" y="409" class="card-title">GHSL GHS-POP</text>
  <text x="95" y="434" class="copy">2020 population grid</text>
  <text x="95" y="456" class="small">Pixel counts aggregated once · S3</text>

  <rect x="380" y="285" width="245" height="150" rx="12" class="aws"/>
  <text x="405" y="327" class="tiny" fill="#bd6849">PYTHON PIPELINE</text>
  <text x="405" y="358" class="card-title">Pair, compare, preserve</text>
  <text x="405" y="385" class="copy">Annual anomalies · ensemble range</text>
  <text x="405" y="408" class="small">Population-total conservation check</text>
  <path d="M317 293H350V320H380" class="line"/><path d="M317 428H350V399H380" class="line"/>

  <rect x="684" y="285" width="205" height="150" rx="12" class="card"/>
  <rect x="706" y="309" width="38" height="38" rx="8" fill="url(#warm)"/>
  <text x="758" y="327" class="tiny" fill="#bd6849">MAP ARCHIVE</text>
  <text x="706" y="377" class="card-title">PMTiles vector cells</text>
  <text x="706" y="403" class="small">Warming percentiles + residents</text>
  <path d="M625 360H684" class="line"/>

  <text x="942" y="214" class="tiny" fill="#819087">02 / EXPLORE THE MAP</text>
  <rect x="942" y="235" width="416" height="204" rx="12" class="card"/>
  <text x="970" y="274" class="tiny" fill="#bd6849">BROWSER · REACT + TYPESCRIPT</text>
  <text x="970" y="307" class="card-title">MapLibre GL JS</text>
  <text x="970" y="333" class="copy">Scenario + period sliders · population layer</text>
  <text x="970" y="357" class="copy">Click a cell to inspect its evidence</text>
  <rect x="970" y="382" width="116" height="25" rx="12" fill="#edf1e9"/>
  <text x="984" y="399" class="small">PMTiles</text>
  <rect x="1096" y="382" width="226" height="25" rx="12" fill="#edf1e9"/>
  <text x="1110" y="399" class="small">Amazon Location basemap</text>
  <path d="M889 350H942" class="line"/>

  <text x="72" y="558" class="tiny" fill="#819087">03 / ASK A GROUNDED AGENT</text>
  <rect x="72" y="581" width="270" height="161" rx="12" class="agent"/>
  <text x="96" y="619" class="tiny" fill="#bd6849">LOCAL PROTOTYPE API</text>
  <text x="96" y="651" class="card-title">FastAPI + Strands</text>
  <text x="96" y="679" class="copy">Validates selected cell + question</text>
  <text x="96" y="703" class="small">No conversation persistence</text>

  <rect x="398" y="555" width="280" height="216" rx="12" class="card"/>
  <text x="422" y="594" class="tiny" fill="#bd6849">READ-ONLY TOOLS</text>
  <text x="422" y="629" class="card-title">Map-cell evidence</text>
  <text x="422" y="653" class="copy">Exact scenario values + limits</text>
  <path d="M422 674H652" stroke="#e1e6de"/>
  <text x="422" y="704" class="card-title">WHO heat guidance</text>
  <text x="422" y="728" class="copy">General planning prompts + source</text>

  <rect x="741" y="581" width="232" height="161" rx="12" class="aws"/>
  <text x="765" y="619" class="tiny" fill="#bd6849">MODEL INVOCATION</text>
  <text x="765" y="652" class="card-title">Amazon Bedrock</text>
  <text x="765" y="680" class="copy">Strands tool-use loop</text>
  <text x="765" y="705" class="small">Only on submitted prompt</text>

  <rect x="1038" y="581" width="320" height="161" rx="12" class="card"/>
  <text x="1062" y="619" class="tiny" fill="#bd6849">COMMUNITY OUTPUT</text>
  <text x="1062" y="652" class="card-title">Preparedness brief</text>
  <text x="1062" y="680" class="copy">Actions + local facts to verify</text>
  <text x="1062" y="705" class="small">Never an alert or health-risk score</text>

  <path d="M1148 439V500H207V581" class="line-red"/>
  <path d="M342 660H398" class="line-red"/>
  <path d="M678 660H741" class="line-red"/>
  <path d="M973 660H1038" class="line-red"/>

  <rect x="72" y="794" width="1286" height="62" rx="10" fill="#e9eee7"/>
  <text x="95" y="822" class="tiny" fill="#71827a">HOSTING PATH DEFINED IN AWS CDK</text>
  <text x="95" y="842" class="copy">Private S3 + CloudFront for the static app and PMTiles archive · Agent API deployment is still pending</text>
</svg>
